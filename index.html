<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Control Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #060214; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #120636 0%, #060214 100%);
        }
        .neon-panel { 
            background: rgba(18, 8, 45, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25); 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-panel:hover {
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }
        .neon-border-glow {
            border: 1px solid #8b5cf6;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.45), inset 0 0 10px rgba(139, 92, 246, 0.2);
        }
        .mood-btn, .namaz-btn, .cal-day-btn {
            background: rgba(31, 14, 77, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            transition: all 0.2s ease;
        }
        .mood-btn:hover, .namaz-btn:hover, .cal-day-btn:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.15);
            border-color: #06b6d4;
            color: #22d3ee;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        .selected { 
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%) !important; 
            border-color: #22d3ee !important; 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            color: #060214 !important; 
            font-weight: 800;
        }
        .has-task {
            border-color: #f472b6 !important;
            box-shadow: inset 0 0 6px rgba(244, 114, 182, 0.4);
        }
        .active-day {
            background: rgba(139, 92, 246, 0.4) !important;
            border-color: #a78bfa !important;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-4xl mx-auto space-y-6">
        
        <div id="auth-screen" class="max-w-md mx-auto bg-purple-950/40 p-8 rounded-2xl neon-border-glow backdrop-blur-md">
            <div class="text-center mb-6">
                <h2 id="auth-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-fuchsia-400 to-cyan-400 uppercase tracking-wider">Gamer Terminal</h2>
                <p id="auth-subtitle" class="text-xs text-cyan-400 mt-1 uppercase tracking-widest font-mono font-bold">Please Log In Below</p>
            </div>
            
            <form id="auth-form" class="space-y-5" onsubmit="return false;">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-300 mb-1.5 font-mono">Username</label>
                    <input type="text" id="username" required autocomplete="username" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-3 focus:outline-none focus:border-cyan-400 text-white font-mono placeholder-purple-800 transition-colors" placeholder="Enter username...">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-purple-300 mb-1.5 font-mono">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-3 focus:outline-none focus:border-cyan-400 text-white font-mono placeholder-purple-800 transition-colors" placeholder="••••••••">
                </div>
                
                <button id="auth-primary-btn" type="button" class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 hover:from-purple-500 hover:to-cyan-500 font-bold py-3 rounded-lg transition-all text-white mt-4 uppercase tracking-wider text-sm shadow-lg shadow-purple-900/40">
                    Log In
                </button>

                <div class="text-center mt-4">
                    <button id="auth-toggle-btn" type="button" class="text-xs text-purple-400 hover:text-cyan-400 font-mono underline transition-colors">
                        Don't have an account? Sign Up here
                    </button>
                </div>
            </form>
        </div>

        <div id="dashboard-screen" class="hidden space-y-6">
            
            <div class="flex flex-col sm:flex-row justify-between items-center p-5 rounded-xl neon-panel gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 uppercase">Dashboard Control</h1>
                    <p class="text-xs text-purple-300 uppercase tracking-widest mt-0.5 font-mono">User Account: <span id="display-username" class="font-bold text-cyan-400 font-mono"></span></p>
                </div>
                <button id="logout-btn" type="button" class="bg-purple-950/30 hover:bg-red-900/40 border border-purple-800 text-purple-300 hover:text-red-400 text-xs font-bold px-5 py-2.5 rounded-lg transition-all uppercase tracking-wider font-mono">
                    Log Out
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="p-5 rounded-xl neon-panel">
                    <h3 class="text-sm font-bold uppercase tracking-widest text-purple-400 mb-4 border-b border-purple-900/60 pb-2 font-mono">How is your mood?</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <button type="button" data-mood="Energetic" class="mood-btn py-4 px-2 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 flex flex-col items-center gap-1 font-mono">
                            <span class="text-xl">⚡</span><span>Energetic</span>
                        </button>
                        <button type="button" data-mood="Focused" class="mood-btn py-4 px-2 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 flex flex-col items-center gap-1 font-mono">
                            <span class="text-xl">🎯</span><span>Focused</span>
                        </button>
                        <button type="button" data-mood="Fatigued" class="mood-btn py-4 px-2 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 flex flex-col items-center gap-1 font-mono">
                            <span class="text-xl">💤</span><span>Tired</span>
                        </button>
                    </div>
                </div>

                <div class="p-5 rounded-xl neon-panel flex flex-col justify-between">
                    <div>
                        <h3 class="text-sm font-bold uppercase tracking-widest text-cyan-400 mb-2 border-b border-purple-900/60 pb-2 font-mono">Water Tracker</h3>
                        <div class="flex items-baseline gap-2 my-4">
                            <span class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 tracking-tight font-mono" id="water-counter">0</span>
                            <span class="text-xs uppercase tracking-wider font-bold text-purple-300 font-mono">Glasses</span>
                        </div>
                    </div>
                    <button id="add-water-btn" type="button" class="w-full bg-gradient-to-r from-blue-600/80 via-indigo-600/80 to-purple-600/80 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-lg text-sm tracking-wider uppercase transition-all shadow-md shadow-purple-950/50 font-mono">
                        Drink 1 Glass
                    </button>
                </div>

            </div>

            <div class="p-5 rounded-xl neon-panel grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 space-y-3">
                    <div class="flex justify-between items-center border-b border-purple-900/60 pb-2">
                        <h3 class="text-sm font-bold uppercase tracking-widest text-cyan-400 font-mono">Calendar</h3>
                        <span id="calendar-month-year" class="text-xs font-bold text-purple-300 font-mono"></span>
                    </div>
                    <div class="grid grid-cols-7 text-center text-[10px] font-bold text-purple-400 uppercase tracking-wider">
                        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                    </div>
                    <div id="calendar-days-grid" class="grid grid-cols-7 gap-1.5"></div>
                </div>

                <div class="flex flex-col justify-between space-y-4">
                    <div>
                        <h3 class="text-sm font-bold uppercase tracking-widest text-pink-400 mb-3 border-b border-purple-900/60 pb-2 font-mono">Tasks For Selected Day</h3>
                        <form id="calendar-form" class="space-y-2 mb-3" onsubmit="return false;">
                            <input type="text" id="cal-text" required placeholder="Type task here..." class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-400 placeholder-purple-950 font-mono">
                            <button id="calendar-submit-btn" type="button" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 font-bold text-xs rounded-lg text-white py-2 transition-all uppercase tracking-wider font-mono">Add Task</button>
                        </form>
                    </div>
                    <div class="flex-grow">
                        <ul id="calendar-list" class="max-h-40 overflow-y-auto pr-1 space-y-1.5"></ul>
                    </div>
                </div>
            </div>

            <div class="p-6 rounded-xl neon-panel space-y-5">
                <h3 class="text-sm font-bold uppercase tracking-widest text-fuchsia-400 border-b border-purple-900/60 pb-2 font-mono">Daily Tracking Data</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-1.5 font-mono">Choose Date</label>
                        <input type="date" id="log-date" value="2026-06-16" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-fuchsia-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-1.5 font-mono">Sleep Time</label>
                        <input type="time" id="bedtime-input" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-fuchsia-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-1.5 font-mono">Wake Up Time</label>
                        <input type="time" id="wakeup-input" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-fuchsia-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-purple-300 uppercase tracking-wider mb-1.5 font-mono">Study Hours</label>
                        <input type="number" id="study-input" min="0" max="24" value="0" class="w-full bg-slate-950/80 border border-purple-900/60 rounded-lg p-2 text-xs font-mono text-white focus:outline-none focus:border-fuchsia-500">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-purple-300 uppercase tracking-wider font-mono">Prayers Prayed (Tap to check mark)</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button type="button" data-namaz="Fajr" class="namaz-btn py-2.5 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 font-mono">Fajr</button>
                        <button type="button" data-namaz="Dhuhr" class="namaz-btn py-2.5 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 font-mono">Dhuhr</button>
                        <button type="button" data-namaz="Asr" class="namaz-btn py-2.5 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 font-mono">Asr</button>
                        <button type="button" data-namaz="Maghrib" class="namaz-btn py-2.5 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 font-mono">Maghrib</button>
                        <button type="button" data-namaz="Isha" class="namaz-btn py-2.5 rounded-lg text-xs font-bold uppercase transition-all text-purple-200 font-mono">Isha</button>
                    </div>
                </div>

                <button id="save-log-btn" type="button" class="w-full bg-gradient-to-r from-fuchsia-600 via-purple-600 to-indigo-600 hover:from-cyan-500 hover:to-purple-500 text-white font-black py-3.5 rounded-lg text-sm tracking-widest uppercase transition-all shadow-lg shadow-purple-950/40 font-mono">
                    Save Entry to History
                </button>
            </div>

            <div class="p-6 rounded-xl neon-panel space-y-4">
                <h3 class="text-sm font-bold uppercase tracking-widest text-emerald-400 border-b border-purple-900/60 pb-2 font-mono">Saved Entries History</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs font-mono text-purple-200">
                        <thead>
                            <tr class="border-b border-purple-900/40 text-purple-400">
                                <th class="pb-2">Date</th>
                                <th class="pb-2">Mood</th>
                                <th class="pb-2">Water</th>
                                <th class="pb-2">Sleep Routine</th>
                                <th class="pb-2">Prayers Completed</th>
                                <th class="pb-2">Study</th>
                            </tr>
                        </thead>
                        <tbody id="history-log-tbody" class="divide-y divide-purple-900/30"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Automatic Fallback System Discovery Link
        // If you still wish to hardcode your Google Apps Script URL later, replace this string.
        let SYNC_API_URL = "AUTO_DISCOVER"; 

        const EMERGENCY_CODE = "88";
        let currentViewingDate = new Date(2026, 5, 16); 
        let selectedDateString = "2026-06-16"; 
        let activeUser = null;
        let isSignUpMode = false;

        let state = { 
            mood: '', 
            water: 0, 
            events: [], 
            namaz: { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false },
            history: [] 
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Try to auto-resolve active API routing targets using localStorage configs across the environment
            const discoveredUrl = localStorage.getItem('resolved_google_sheets_api_url');
            if (discoveredUrl) {
                SYNC_API_URL = discoveredUrl;
            }

            if (!localStorage.getItem('user_profile_gamer_beast')) {
                localStorage.setItem('user_profile_gamer_beast', JSON.stringify({ password: '12345' }));
            }

            document.getElementById('auth-primary-btn').addEventListener('click', handleAuthAction);
            document.getElementById('auth-toggle-btn').addEventListener('click', toggleAuthMode);
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('add-water-btn').addEventListener('click', addWaterIntake);
            document.getElementById('calendar-submit-btn').addEventListener('click', addCalendarEvent);
            document.getElementById('save-log-btn').addEventListener('click', saveEntryToHistoryLog);
            
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.addEventListener('click', () => setMoodState(btn.dataset.mood));
            });

            document.querySelectorAll('.namaz-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleNamazState(btn, btn.dataset.namaz));
            });

            document.getElementById('log-date').value = selectedDateString;
        });

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const primaryBtn = document.getElementById('auth-primary-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');

            if (isSignUpMode) {
                title.innerText = "Register Core";
                subtitle.innerText = "Create Your Custom Tracker Account";
                primaryBtn.innerText = "Sign Up and Register";
                toggleBtn.innerText = "Already have an account? Log In here";
            } else {
                title.innerText = "Gamer Terminal";
                subtitle.innerText = "Please Log In Below";
                primaryBtn.innerText = "Log In";
                toggleBtn.innerText = "Don't have an account? Sign Up here";
            }
        }

        function handleAuthAction() {
            const userIn = document.getElementById('username').value.trim().toLowerCase();
            const passIn = document.getElementById('password').value.trim();

            if (!userIn || !passIn) {
                alert("Please check username and password parameters.");
                return;
            }

            if (passIn === EMERGENCY_CODE) {
                alert("EMERGENCY FLUSH EXECUTION: Clearing browser storage metrics row channels.");
                localStorage.clear();
                handleLogout();
                return;
            }

            const storageKey = `user_profile_${userIn}`;
            const existingUser = localStorage.getItem(storageKey);

            if (isSignUpMode) {
                if (existingUser) {
                    alert("This username already exists.");
                    return;
                }
                
                // Check if the registration token is the actual URL config token hook line
                if (passIn.startsWith("https://script.google.com/")) {
                    localStorage.setItem('resolved_google_sheets_api_url', passIn);
                    SYNC_API_URL = passIn;
                    alert("System Bridge Configured! Google Sheets routing target linked successfully.");
                    document.getElementById('password').value = '';
                    return;
                }

                const profileObj = { password: passIn };
                localStorage.setItem(storageKey, JSON.stringify(profileObj));
                alert("Registration complete! Switching framework to launch panel access.");
                isSignUpMode = false;
                toggleAuthMode();
            } else {
                if (!existingUser) {
                    alert("Account parameters not found.");
                    return;
                }
                const parsedProfile = JSON.parse(existingUser);
                if (parsedProfile.password !== passIn) {
                    alert("Invalid password entries.");
                    return;
                }

                activeUser = userIn;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('display-username').innerText = userIn;
                
                loadUserDatabaseState();
                buildVisualCalendarGrid();
                renderSelectedDayTasks();
                updateHistoryLogTableUI();
            }
        }

        function handleLogout() {
            activeUser = null;
            state = { mood: '', water: 0, events: [], namaz: { Fajr: false, Dhuhr: false, Asr: false, Maghrib: false, Isha: false }, history: [] };
            
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('water-counter').innerText = '0';
            
            document.querySelectorAll('.mood-btn, .namaz-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('calendar-list').innerHTML = '';
            document.getElementById('history-log-tbody').innerHTML = '';
        }

        function saveUserDatabaseState() {
            if (!activeUser) return;
            localStorage.setItem(`user_data_history_${activeUser}`, JSON.stringify(state.history));
            localStorage.setItem(`user_data_tasks_${activeUser}`, JSON.stringify(state.events));
        }

        function loadUserDatabaseState() {
            if (!activeUser) return;
            const archivedHistory = localStorage.getItem(`user_data_history_${activeUser}`);
            const archivedTasks = localStorage.getItem(`user_data_tasks_${activeUser}`);
            
            state.history = archivedHistory ? JSON.parse(archivedHistory) : [];
            state.events = archivedTasks ? JSON.parse(archivedTasks) : [];
        }

        function setMoodState(moodValue) {
            state.mood = moodValue;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.mood === moodValue);
            });
        }

        function toggleNamazState(element, prayerName) {
            state.namaz[prayerName] = !state.namaz[prayerName];
            element.classList.toggle('selected', state.namaz[prayerName]);
        }

        function addWaterIntake() {
            state.water += 1; 
            document.getElementById('water-counter').innerText = state.water;
        }

        function buildVisualCalendarGrid() {
            const gridContainer = document.getElementById('calendar-days-grid');
            const monthYearLabel = document.getElementById('calendar-month-year');
            if(!gridContainer) return;

            gridContainer.innerHTML = '';
            const year = currentViewingDate.getFullYear();
            const month = currentViewingDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearLabel.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                gridContainer.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDaysInMonth; day++) {
                const dayBtn = document.createElement('button');
                dayBtn.type = "button";
                dayBtn.className = "cal-day-btn py-2 text-xs font-mono font-bold rounded transition-all text-purple-100 text-center";
                dayBtn.innerText = day;

                const currentStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (currentStr === selectedDateString) dayBtn.classList.add('active-day');
                
                const dayHasTasks = state.events.some(ev => ev.date === currentStr);
                if (dayHasTasks) dayBtn.classList.add('has-task');

                dayBtn.addEventListener('click', () => {
                    selectedDateString = currentStr;
                    document.getElementById('log-date').value = currentStr;
                    buildVisualCalendarGrid();
                    renderSelectedDayTasks();
                });

                gridContainer.appendChild(dayBtn);
            }
        }

        function addCalendarEvent() {
            const textInput = document.getElementById('cal-text');
            if (!textInput.value) {
                alert("Please type a description before adding a task.");
                return;
            }

            state.events.push({
                id: Date.now().toString(),
                date: selectedDateString,
                text: textInput.value
            });

            textInput.value = '';
            saveUserDatabaseState();
            buildVisualCalendarGrid();
            renderSelectedDayTasks();
        }

        function renderSelectedDayTasks() {
            const listContainer = document.getElementById('calendar-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const filteredTasks = state.events.filter(ev => ev.date === selectedDateString);

            if(filteredTasks.length === 0) {
                listContainer.innerHTML = `<li class="text-xs text-purple-400 italic font-mono p-2">No tasks logged for today</li>`;
                return;
            }

            filteredTasks.forEach(ev => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-2 bg-purple-950/40 rounded-lg border border-purple-900/40 text-xs font-mono";
                li.innerHTML = `
                    <span class="text-purple-200 truncate pr-2">${ev.text}</span>
                    <button type="button" onclick="deleteCalendarEvent('${ev.id}')" class="text-rose-500 hover:text-rose-400 font-bold px-1 focus:outline-none transition-colors">✕</button>
                `;
                listContainer.appendChild(li);
            });
        }

        window.deleteCalendarEvent = function(id) {
            state.events = state.events.filter(ev => ev.id !== id);
            saveUserDatabaseState();
            buildVisualCalendarGrid();
            renderSelectedDayTasks();
        }

        function saveEntryToHistoryLog() {
            const completedPrayers = Object.keys(state.namaz)
                                           .filter(key => state.namaz[key])
                                           .join(', ') || "None";

            const logItem = {
                date: document.getElementById('log-date').value,
                mood: state.mood || "Not Picked",
                water: `${state.water} Glasses`,
                sleep: `${document.getElementById('bedtime-input').value || '--'} to ${document.getElementById('wakeup-input').value || '--'}`,
                namaz: completedPrayers,
                study: `${document.getElementById('study-input').value} Hrs`
            };

            state.history.unshift(logItem);
            saveUserDatabaseState();
            updateHistoryLogTableUI();
            alert("Entry saved to account dashboard!");

            // Automatic Transmission Handler Matrix Engine
            if (SYNC_API_URL !== "AUTO_DISCOVER" && SYNC_API_URL !== "") {
                const payload = {
                    username: activeUser, 
                    password: "PROTECTED_LOCAL_AUTH", 
                    emergencyUsed: "NO", 
                    date: logItem.date, 
                    mood: logItem.mood, 
                    bedtime: document.getElementById('bedtime-input').value || "Not Logged", 
                    wakeup: document.getElementById('wakeup-input').value || "Not Logged", 
                    namaz: logItem.namaz, 
                    study: document.getElementById('study-input').value, 
                    water: logItem.water
                };
                fetch(SYNC_API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                }).catch(e => console.log("Transmission error tracker sync: ", e));
            }
        }

        function updateHistoryLogTableUI() {
            const tbody = document.getElementById('history-log-tbody');
            if(!tbody) return;
            tbody.innerHTML = '';

            if (state.history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-purple-400 italic">No saved tracking history found yet.</td></tr>`;
                return;
            }

            state.history.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-purple-950/20 transition-colors";
                tr.innerHTML = `
                    <td class="py-2.5 text-cyan-400 font-bold">${row.date}</td>
                    <td class="py-2.5 text-purple-200">${row.mood}</td>
                    <td class="py-2.5 text-blue-400">${row.water}</td>
                    <td class="py-2.5 text-purple-300">${row.sleep}</td>
                    <td class="py-2.5 text-fuchsia-400">${row.namaz}</td>
                    <td class="py-2.5 text-yellow-400">${row.study}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
