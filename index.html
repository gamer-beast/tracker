<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoRoutine - Secure Space Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #090b14 0%, #010206 100%);
            overflow-x: hidden;
        }
        .heading-font { font-family: 'Orbitron', sans-serif; }
        .neon-border-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border: 1px solid rgba(168, 85, 247, 0.6); }
        .neon-border-blue { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); border: 1px solid rgba(59, 130, 246, 0.6); }
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            z-index: 0; opacity: 0.5;
        }
        .water-glass { transition: all 0.2s ease; cursor: pointer; }
        .water-glass:hover { transform: scale(1.2); }
        .mood-btn { transition: all 0.2s ease; }
        .calendar-day { transition: all 0.15s ease; }
        .calendar-day:hover { background-color: rgba(168, 85, 247, 0.2); cursor: pointer; }
    </style>
</head>
<body class="text-gray-100 min-h-screen relative flex flex-col items-center justify-center p-4">

    <div class="stars"></div>

    <div id="auth-screen" class="w-full max-w-md bg-slate-900/80 backdrop-blur-md rounded-2xl p-8 neon-border-purple z-10">
        <div class="text-center mb-6">
            <h1 class="heading-font text-3xl font-bold bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 bg-clip-text text-transparent tracking-widest animate-pulse">
                COSMO GATEWAY
            </h1>
            <p id="auth-subtitle" class="text-gray-400 mt-2 text-sm uppercase tracking-wider">Initialize secure pilot login</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-purple-400 mb-2 font-bold">Pilot Username</label>
                <input type="text" id="username" class="w-full bg-slate-950/80 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all" placeholder="Enter username...">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-purple-400 mb-2 font-bold">Access Code</label>
                <input type="password" id="password" class="w-full bg-slate-950/80 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all" placeholder="Enter access code...">
            </div>

            <div id="signup-extra-fields" class="hidden space-y-4 border-t border-slate-800/80 pt-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-amber-400 mb-2 font-bold">Create Custom Emergency Override Key</label>
                    <input type="password" id="custom-emergency-key" class="w-full bg-slate-950/80 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition-all" placeholder="Pick your emergency bypass code...">
                </div>
            </div>

            <div id="override-container" class="hidden mt-2 p-3 bg-red-950/40 border border-red-500/30 rounded-lg">
                <label class="block text-[11px] uppercase tracking-wider text-red-400 mb-1 font-bold">⚠️ Security Lockout: Enter Your Emergency Override Key</label>
                <input type="password" id="master-key" class="w-full bg-slate-950 border border-red-500/50 rounded px-3 py-1.5 text-xs text-white focus:outline-none" placeholder="Enter override protocol...">
            </div>

            <div id="login-feedback" class="text-xs font-bold text-center h-4 text-red-400"></div>

            <button id="auth-main-btn" onclick="handleAuthAction()" class="w-full heading-font bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-3 rounded-lg uppercase tracking-wider shadow-lg shadow-purple-500/20 transition-all transform hover:scale-[1.02]">
                Launch Dashboard
            </button>
        </div>
    </div>

    <div id="app-screen" class="w-full max-w-7xl z-10 hidden my-4">
        
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/80 backdrop-blur-md rounded-xl p-6 mb-6 neon-border-blue gap-4">
            <div>
                <h1 class="heading-font text-2xl font-bold tracking-wider text-blue-400">COMMAND CENTER</h1>
                <p id="welcome-msg" class="text-gray-400 text-sm">Welcome back, Pilot</p>
            </div>
            
            <div class="flex flex-wrap gap-4 items-center justify-center">
                <div class="text-center bg-slate-950/60 px-4 py-2 rounded-lg border border-purple-500/30">
                    <span class="block text-xs text-purple-400 uppercase tracking-widest font-bold">Stardust Points</span>
                    <span id="stat-points" class="heading-font text-2xl font-bold text-yellow-400">0</span>
                </div>
                <div class="text-center bg-slate-950/60 px-4 py-2 rounded-lg border border-pink-500/30">
                    <span class="block text-xs text-pink-400 uppercase tracking-widest font-bold">Namaz Streak</span>
                    <span id="stat-streak" class="heading-font text-2xl font-bold text-pink-500">0 Days</span>
                </div>
                <button onclick="handleLogout()" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/30 px-3 py-1 rounded text-sm transition-all">
                    Disconnect Deck
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-slate-900/90 backdrop-blur-md rounded-xl p-6 border border-slate-800">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="heading-font text-lg font-bold text-purple-400 uppercase tracking-wider">🚀 Mission Input Matrix</h2>
                        <span id="active-date-badge" class="text-xs px-2 py-1 rounded bg-purple-950 text-purple-300 font-bold border border-purple-500/30">Target: Today</span>
                    </div>
                    
                    <form id="metrics-form" onsubmit="saveLog(event)" class="space-y-4">
                        <input type="hidden" id="edit-log-id">
                        
                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-1 font-bold">Stardate Log Coordinates</label>
                            <input type="date" id="log-date" onchange="syncInputToDate()" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-2 font-bold">Biometric Mood Resonance</label>
                            <div class="grid grid-cols-4 gap-2" id="mood-selector-container">
                                <button type="button" onclick="setMoodState('🚀 Radiant')" id="mood-radiant" class="mood-btn p-2 rounded bg-slate-950 border border-slate-800 text-center text-sm hover:border-yellow-500">
                                    <span class="block text-xl">🚀</span> <span class="text-xs font-bold text-gray-400">Radiant</span>
                                </button>
                                <button type="button" onclick="setMoodState('⭐ Stable')" id="mood-stable" class="mood-btn p-2 rounded bg-slate-950 border border-slate-800 text-center text-sm hover:border-blue-500">
                                    <span class="block text-xl">⭐</span> <span class="text-xs font-bold text-gray-400">Stable</span>
                                </button>
                                <button type="button" onclick="setMoodState('☁️ Foggy')" id="mood-foggy" class="mood-btn p-2 rounded bg-slate-950 border border-slate-800 text-center text-sm hover:border-purple-500">
                                    <span class="block text-xl">☁️</span> <span class="text-xs font-bold text-gray-400">Foggy</span>
                                </button>
                                <button type="button" onclick="setMoodState('💥 Turbulent')" id="mood-turbulent" class="mood-btn p-2 rounded bg-slate-950 border border-slate-800 text-center text-sm hover:border-red-500">
                                    <span class="block text-xl">💥</span> <span class="text-xs font-bold text-gray-400">Stormy</span>
                                </button>
                            </div>
                            <input type="hidden" id="log-mood" value="⭐ Stable">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-xs text-gray-400 uppercase font-bold">H₂O Liquid Core Alignment</label>
                                <span class="text-xs text-cyan-400 font-bold" id="water-count-display">0 / 8 Glasses</span>
                            </div>
                            <div class="bg-slate-950 p-3 rounded border border-slate-800 flex justify-between items-center gap-1" id="water-matrix"></div>
                            <input type="hidden" id="water-glasses" value="0">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-gray-400 uppercase mb-1">Enter Bedtime</label>
                                <input type="time" id="sleep-bedtime" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 uppercase mb-1">Wake Up Coordinates</label>
                                <input type="time" id="sleep-wakeup" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-2 font-bold tracking-wider text-pink-400">Daily Namaz Communication Links</label>
                            <div class="grid grid-cols-5 gap-1.5 bg-slate-950 p-2 rounded border border-slate-800 text-center">
                                <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded cursor-pointer text-xs"><input type="checkbox" id="namaz-fajr" class="accent-pink-500 mb-1">Fajr</label>
                                <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded cursor-pointer text-xs"><input type="checkbox" id="namaz-dhuhr" class="accent-pink-500 mb-1">Dhuhr</label>
                                <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded cursor-pointer text-xs"><input type="checkbox" id="namaz-asr" class="accent-pink-500 mb-1">Asr</label>
                                <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded cursor-pointer text-xs"><input type="checkbox" id="namaz-maghrib" class="accent-pink-500 mb-1">Magh</label>
                                <label class="flex flex-col items-center justify-center p-2 bg-slate-900 rounded cursor-pointer text-xs"><input type="checkbox" id="namaz-isha" class="accent-pink-500 mb-1">Isha</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-1 font-bold">Study Matrix Duration (Hours)</label>
                            <input type="number" id="study-hours" min="0" max="24" step="0.5" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none" placeholder="e.g. 4 Hours">
                        </div>

                        <div class="flex gap-2 pt-1">
                            <button type="submit" id="submit-log-btn" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-2.5 px-4 rounded text-sm uppercase tracking-wider transition-all">
                                Commit Log Vector
                            </button>
                            <button type="button" id="cancel-edit-btn" onclick="resetLogForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-gray-300 py-2 px-3 rounded text-sm">
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div class="md:col-span-7 bg-slate-900/80 backdrop-blur-md rounded-xl p-6 border border-slate-800">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="heading-font text-sm font-bold text-cyan-400 uppercase tracking-wider">📅 Interactive Stardate Grid</h2>
                            <span class="text-xs font-bold text-gray-400">June 2026</span>
                        </div>
                        <div class="bg-slate-950 p-2.5 rounded border border-slate-800">
                            <div class="grid grid-cols-7 gap-1 text-center text-[10px] uppercase text-gray-500 font-bold mb-1">
                                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                            </div>
                            <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
                        </div>
                        <form onsubmit="addCalendarEvent(event)" class="mt-3 flex gap-1.5">
                            <input type="date" id="cal-date" required class="bg-slate-950 border border-slate-700 text-xs rounded px-2 py-1 text-white focus:outline-none">
                            <input type="text" id="cal-text" required placeholder="Event log note..." class="flex-1 bg-slate-950 border border-slate-700 text-xs rounded px-2 py-1
