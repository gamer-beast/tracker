<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Control Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .neon-border { border: 1px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .selected { background-color: #7c3aed !important; border-color: #a78bfa !important; color: #ffffff !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        
        <div id="login-screen" class="max-w-md mx-auto mt-12 bg-gray-900 p-6 rounded-lg neon-border">
            <div id="login-box">
                <h2 class="text-2xl font-bold text-blue-400 mb-4 text-center tracking-wide">Terminal Login</h2>
                <form id="login-form" class="space-y-4" onsubmit="return false;">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-300">Username</label>
                        <input type="text" id="username" required autocomplete="username" class="w-full bg-gray-800 border border-gray-700 rounded p-2 focus:outline-none focus:border-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-300">Password</label>
                        <input type="password" id="password" required autocomplete="current-password" class="w-full bg-gray-800 border border-gray-700 rounded p-2 focus:outline-none focus:border-blue-500 text-white">
                    </div>
                    <button id="login-submit-btn" type="button" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2 rounded transition-colors text-white mt-2">Access Dashboard</button>
                </form>
            </div>
        </div>

        <div id="dashboard-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-900 p-4 rounded-lg neon-border">
                <div>
                    <h1 class="text-xl font-bold text-blue-400 tracking-wide">System Control Matrix</h1>
                    <p class="text-sm text-gray-400">User: <span id="display-username" class="font-bold text-white"></span></p>
                </div>
                <button id="logout-btn" type="button" class="bg-red-600 hover:bg-red-500 text-xs font-bold px-4 py-2 rounded text-white">Logout</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800">
                    <h3 class="text-md font-bold uppercase text-purple-400 mb-3 tracking-wider">Condition Tracking Log</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" data-mood="Energetic" class="mood-btn bg-gray-800 hover:bg-gray-700 p-3 rounded text-sm text-gray-200">⚡ Energetic</button>
                        <button type="button" data-mood="Focused" class="mood-btn bg-gray-800 hover:bg-gray-700 p-3 rounded text-sm text-gray-200">🎯 Focused</button>
                        <button type="button" data-mood="Fatigued" class="mood-btn bg-gray-800 hover:bg-gray-700 p-3 rounded text-sm text-gray-200">💤 Fatigued</button>
                    </div>
                </div>

                <div class="bg-gray-900 p-4 rounded-lg border border-gray-800 flex flex-col justify-between">
                    <div>
                        <h3 class="text-md font-bold uppercase text-blue-400 mb-1 tracking-wider">Hydration Subsystem</h3>
                        <p class="text-3xl font-black text-white my-2" id="water-counter">0 ml</p>
                    </div>
                    <button id="add-water-btn" type="button" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm font-bold text-white">Log 250ml Volume</button>
                </div>
            </div>

            <div class="bg-gray-900 p-4 rounded-lg border border-gray-800 space-y-4">
                <h3 class="text-md font-bold uppercase text-yellow-400 tracking-wider">Spreadsheet Mirror Data Stream</h3>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Target Date</label>
                        <input type="date" id="log-date" value="2026-06-16" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Bedtime</label>
                        <input type="time" id="bedtime-input" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Wakeup</label>
                        <input type="time" id="wakeup-input" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Prayer Log</label>
                        <select id="namaz-select" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Study (Hrs)</label>
                        <input type="number" id="study-input" min="0" max="24" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1.5 text-xs text-white">
                    </div>
                </div>
                <button id="sync-sheets-btn" type="button" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2.5 rounded">
                    Compile and Transmit Metrics Payload
                </button>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE WEB APP URL HERE BETWEEN THE QUOTES
        const SYNC_API_URL = "https://script.google.com/macros/s/XXXXX/exec"; 

        // Hardcoded Master Admin Account Setup
        const ADMIN_USER = "gamer_beast";
        const ADMIN_PASS = "12345";
        const EMERGENCY_CODE = "88";

        let activeUser = null;
        let state = { mood: '', water: 0 };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-submit-btn').addEventListener('click', handleLogin);
            document.getElementById('logout-btn').addEventListener('click', handleLogout);
            document.getElementById('add-water-btn').addEventListener('click', addWaterIntake);
            document.getElementById('sync-sheets-btn').addEventListener('click', syncToGoogleSheets);
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.addEventListener('click', () => setMoodState(btn.dataset.mood));
            });
        });

        function handleLogin() {
            const userIn = document.getElementById('username').value.trim();
            const passIn = document.getElementById('password').value.trim();

            // Emergency Override Trigger check
            if (passIn === EMERGENCY_CODE) {
                alert("EMERGENCY INTERCEPT: Clearing session parameters.");
                handleLogout();
                return;
            }

            // Admin Authorization Verification
            if (userIn === ADMIN_USER && passIn === ADMIN_PASS) {
                activeUser = ADMIN_USER;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                document.getElementById('display-username').innerText = ADMIN_USER;
            } else {
                alert("Access Denied. Invalid credentials row match.");
            }
        }

        function handleLogout() {
            activeUser = null;
            state = { mood: '', water: 0 };
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function setMoodState(moodValue) {
            state.mood = moodValue;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.mood === moodValue);
            });
        }

        function addWaterIntake() {
            state.water += 250;
            document.getElementById('water-counter').innerText = `${state.water} ml`;
        }

        function syncToGoogleSheets() {
            const payload = {
                username: activeUser,
                password: ADMIN_PASS, // Sends your configured password field
                emergencyUsed: (document.getElementById('password').value === EMERGENCY_CODE) ? "YES" : "NO",
                date: document.getElementById('log-date').value,
                mood: state.mood || "Unassigned",
                bedtime: document.getElementById('bedtime-input').value || "Not Logged",
                wakeup: document.getElementById('wakeup-input').value || "Not Logged",
                namaz: document.getElementById('namaz-select').value,
                study: document.getElementById('study-input').value,
                water: `${state.water} ml`
            };

            if (SYNC_API_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                alert("Local verification passed! Add your real Google Script URL to run the live cloud sync.");
                console.log("Payload compiled:", payload);
                return;
            }

            fetch(SYNC_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => alert("Data packet successfully dispatched to Google Sheets row connection!"))
            .catch(err => alert("Sync execution transmission error: " + err));
        }
    </script>
</body>
</html>
